[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "live: tests that call the real Gemini API (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["venv", ".venv", "uploads", "sample_data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
